name: API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements.lock && .venv/bin/pip install --no-deps -e .
      - run: make lint
      - run: docker compose -p careready-ch17-test -f compose.test.yaml up -d --wait
      - run: RUN_INTEGRATION=1 .venv/bin/python -m pytest -q
      - run: .venv/bin/python scripts/verify_isolated.py --contracts
      - run: .venv/bin/python scripts/verify_network.py
      - run: docker build -t careready-demo:ci .
      - if: always()
        run: docker compose -p careready-ch17-test -f compose.test.yaml down
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run test --prefix frontend
      - run: npm run build --prefix frontend
      - run: docker build -t careready-web:ci frontend
