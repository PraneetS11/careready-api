# Local fictional-data demo. Publish only the API behind HTTPS on a chosen host.
x-app: &app
  image: careready-demo:${IMAGE_TAG:-local}
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://demo:${DEMO_DB_PASSWORD:?set DEMO_DB_PASSWORD}@postgres:5432/demo
    DATABASE_SSL: "false"
    JWT_SECRET_KEY: ${DEMO_JWT_SECRET:?set DEMO_JWT_SECRET}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    MAIL_SERVER: mailpit
    MAIL_PORT: "1025"
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8009}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1"]}
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    ENVIRONMENT: development
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?set DEMO_DB_PASSWORD}
      POSTGRES_DB: demo
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8029:8025"]
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    build: .
    ports: ["127.0.0.1:8009:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 20
  worker:
    <<: *app
    command: ["celery", "-A", "app.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
volumes:
  database:
  redis:
