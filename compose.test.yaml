services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ch17
      POSTGRES_PASSWORD: disposable-test-only
      POSTGRES_DB: ch17
    ports: ["127.0.0.1:5446:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ch17 -d ch17"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6396:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
