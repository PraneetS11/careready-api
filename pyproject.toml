[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careready-api"
version = "0.1.0"
description = "CareReady API foundation"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3", "sqlmodel>=0.0.22,<0.1", "sqlalchemy[asyncio]>=2.0,<2.1", "asyncpg>=0.30,<1", "redis>=5,<7", "pwdlib[argon2]>=0.3,<1", "email-validator>=2.2,<3", "PyJWT>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1"]
progression = ["alembic>=1.14,<2", "celery[redis]>=5.4,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
